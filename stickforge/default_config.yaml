# stickforge engine defaults. A config.yaml in the working directory (or --config /
# STICKFORGE_CONFIG) is deep-merged over this file. Secrets never go here: reference
# them by environment variable name via `api_key_env`.
#
# Model ids / endpoints were checked on 2026-10-23 against the providers' official SDK
# sources and cookbooks; prices come from litellm's cost map (v1.106.2) — re-check
# them on the providers' pricing pages before relying on cost reports.

seed: 1234
cache_dir: .cache        # relative to the project folder
output_dir: renders      # relative to the project folder
models_dir: ""           # "" = ~/.cache/stickforge/models (Windows: %LOCALAPPDATA%\stickforge\models)

qa:
  max_retries: 2         # failed QA -> regenerate with a new seed, then flag in report.json

retry:
  max_attempts: 4        # 429 / 5xx / timeouts only; auth + validation errors never retry
  base_delay_s: 1.0
  max_delay_s: 30.0

# Local model files, pinned by sha256 (`stickforge models pull <key>`).
models:
  kokoro-v1.0-int8:
    url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
    sha256: ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c
    file: kokoro-v1.1/kokoro-v1.0.int8.onnx
    max_bytes: 150000000
    license_note: Kokoro-82M, Apache-2.0
  kokoro-v1.0-fp32:
    url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
    sha256: beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a
    file: kokoro-v1.1/kokoro-v1.0.onnx
    max_bytes: 400000000
    license_note: Kokoro-82M, Apache-2.0
  kokoro-voices-v1.0:
    url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
    sha256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
    file: kokoro-v1.1/voices-v1.0.bin
    max_bytes: 50000000
    license_note: Kokoro-82M voices, Apache-2.0

providers:
  # --- TTS -----------------------------------------------------------------
  kokoro_int8:                       # smaller download / RAM; slower on many x86 CPUs
    adapter: kokoro
    settings: {model: kokoro-v1.0-int8, voices: kokoro-voices-v1.0}
  kokoro:
    adapter: kokoro
    settings: {model: kokoro-v1.0-fp32, voices: kokoro-voices-v1.0}
  elevenlabs:
    adapter: elevenlabs
    model: eleven_multilingual_v2
    api_key_env: ELEVENLABS_API_KEY
    max_concurrency: 2
    cost: {per_1k_chars_usd: 0.0}   # plan-dependent: set from your ElevenLabs plan
  silent:
    adapter: silent
    settings: {words_per_minute: 150}
  tone:                              # test stub with real loudness (offline tests)
    adapter: tone
    settings: {words_per_minute: 150}

  # --- Images --------------------------------------------------------------
  gemini_lite:                       # "Nano-Banana 2 Lite": fastest/cheapest, <= 3 refs
    adapter: gemini
    model: gemini-3.1-flash-lite-image
    api_key_env: GEMINI_API_KEY
    max_concurrency: 4
    requests_per_minute: 10          # raise to match your AI Studio tier
    timeout_s: 120
    cost: {per_image_usd: 0.0336}
    settings: {image_size: 1K, max_refs: 3}
  gemini_flash:                      # "Nano-Banana 2": higher quality, 2K, <= 14 refs
    adapter: gemini
    model: gemini-3.1-flash-image
    api_key_env: GEMINI_API_KEY
    max_concurrency: 4
    requests_per_minute: 10
    timeout_s: 180
    cost: {per_image_usd: 0.045}     # 1K list price; 2K costs more — check pricing page
    settings: {image_size: 2K, max_refs: 6}
  fal_schnell:                       # FLUX schnell on fal: cheap fallback, no refs
    adapter: fal
    model: fal-ai/flux/schnell
    api_key_env: FAL_KEY
    max_concurrency: 4
    timeout_s: 120
    cost: {per_image_usd: 0.003}
    license_note: FLUX.1 [schnell], Apache-2.0
    settings:
      # Model input fields not verifiable from this environment (fal.ai blocked);
      # adjust here if fal's model page differs.
      input: {image_size: landscape_16_9, output_format: png, enable_safety_checker: true}
  openai_image:                      # any OpenAI-compatible images endpoint; not in a chain
    adapter: openai_compat           # by default — add it to modes.<m>.chains.image to use
    model: gpt-image-2               # set to what your provider serves
    endpoint: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_s: 180
    cost: {per_image_usd: 0.0}       # fill in from your provider's pricing page
    settings: {size: 1536x864, extra: {quality: medium, output_format: png}}
  placeholder:
    adapter: placeholder

  # --- Caption alignment (per scene, first that works) ----------------------
  tts_timestamps:                    # free + exact when the TTS returns word timings
    adapter: tts_timestamps
  whisperx:                          # optional extra; forced alignment, CPU ok
    adapter: whisperx
    settings: {language: en, device: cpu}
  scene_level:                       # always available: proportional estimate
    adapter: scene_level

  # --- LLM / QA --------------------------------------------------------------
  gemini_qa:
    adapter: litellm_vision_qa
    model: gemini/gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    timeout_s: 60
  gemini_llm:
    adapter: litellm
    model: gemini/gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    timeout_s: 60

# Chains are fallback orders. Providers that are not ready (missing key, dependency or
# model file) are skipped; a stub (silent / placeholder) being used is reported loudly.
modes:
  draft:
    width: 1280
    height: 720
    fps: 30
    x264_preset: veryfast
    crf: 23
    camera_oversample: 2   # faster drafts; final uses render.camera.oversample (4)
    qa: false
    chains:
      tts: [kokoro, silent]   # fp32: on x86 CPUs it measured ~4x faster than int8
      image: [gemini_lite, fal_schnell, placeholder]
      vision_qa: [gemini_qa]
      align: [tts_timestamps, whisperx, scene_level]
  final:
    width: 1920
    height: 1080
    fps: 30
    x264_preset: medium
    crf: 18
    qa: true
    chains:
      tts: [kokoro, silent]
      image: [gemini_flash, gemini_lite, fal_schnell, placeholder]
      vision_qa: [gemini_qa]
      align: [tts_timestamps, whisperx, scene_level]

render:
  camera:
    zoom_amount: 0.12    # slow_zoom_in/out: 1.00 <-> 1.12
    pan_zoom: 1.12       # pans run at this zoom
    oversample: 4        # zoompan internal resolution multiple (4 = ~0.2 px jitter)
  title_delay_s: 0.25    # on-screen text appears after this, fading in
  title_fade_in_s: 0.35
  encoder: auto          # auto | libx264 | h264_nvenc | h264_videotoolbox | h264_qsv
  max_parallel: 0        # 0 = auto (cpu_count // 2, min 1)
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  timeout_base_s: 60     # per ffmpeg run: base + per_second * media seconds
  timeout_per_media_s: 10

audio:
  sample_rate: 48000
  aac_bitrate: 192k
  fade_ms: 8             # fade in/out on every voice clip (no clicks at joins)
  loudness_i: -14.0      # integrated loudness target, LUFS (YouTube reference)
  true_peak: -1.0        # dBTP ceiling
  lra: 11.0
  sfx_volume_db: -6.0
  duck_threshold: 0.02   # music ducking (sidechain compressor keyed by the voice)
  duck_ratio: 8.0
  duck_attack_ms: 20
  duck_release_ms: 400
  music_fade_in_s: 1.0
  music_fade_out_s: 2.5
