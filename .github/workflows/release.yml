name: Release

# Push a tag like v1.0.0 to build the buyer package and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          v=$(uv version --short)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: uv build
      - name: Buyer zip (source tree without dev history)
        run: |
          name="stickforge-${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "stickforge $GITHUB_REF_NAME" --notes-file CHANGELOG.md
