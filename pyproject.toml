[project]
name = "stickforge"
version = "1.0.0"
description = "Local, provider-agnostic engine that turns a narration script into a YouTube-ready stickman explainer video."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Asmit Patel" }]
keywords = ["video", "explainer", "stickman", "text-to-video", "tts", "ffmpeg", "mcp", "youtube"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.6.1,<0.7", "numpy>=2.0"]   # local TTS (CPU, ~100 MB + model files)
llm = ["litellm>=1.50"]                              # LLM / vision-QA calls
mcp = ["mcp>=1.12"]                                # `stickforge mcp`: MCP server over stdio

[project.urls]
Homepage = "https://github.com/asmitpro01/cloud-day1-project"
Changelog = "https://github.com/asmitpro01/cloud-day1-project/blob/main/CHANGELOG.md"

[project.scripts]
stickforge = "stickforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stickforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S101", "S603", "B008"]  # assert in tests; subprocess w/o shell is our only use; typer defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["stickforge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["stickforge.providers.*"]
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: renders real video with ffmpeg (slower)"]

[[tool.mypy.overrides]]
module = ["whisperx", "whisperx.*", "kokoro_onnx", "kokoro_onnx.*", "litellm", "litellm.*"]
ignore_missing_imports = true   # optional extras; may be absent where mypy runs
