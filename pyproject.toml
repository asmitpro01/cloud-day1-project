[project]
name = "stickforge"
version = "0.1.0"
description = "Local, provider-agnostic engine that turns a scene plan into a YouTube-ready stickman explainer video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.6.1,<0.7", "numpy>=2.0"]   # local TTS (CPU, ~100 MB + model files)
llm = ["litellm>=1.50"]                              # LLM / vision-QA calls
align = ["whisperx>=3.3"]                            # word-level captions (pulls PyTorch, >1 GB)

[project.scripts]
stickforge = "stickforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stickforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S101", "S603", "B008"]  # assert in tests; subprocess w/o shell is our only use; typer defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["stickforge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["stickforge.providers.*"]
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: renders real video with ffmpeg (slower)"]
